<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saved Tasks</title>

<style>
:root{
    --bg:#f6f3fb;
    --panel:#ffffff;
    --purple-100:#f0e7ff;
    --purple-300:#c9b7ff;
    --purple-500:#7f3ff2;
    --purple-700:#5a1db3;
    --muted:#7b6f88;
    --success:#4caf50;
    --danger:#9e1e1e;
    --orange:#ff9800;
    --blue:#2196f3;
}

body{
    font-family: Calibri, sans-serif;
    margin:0;
    padding:22px;
    background: linear-gradient(180deg, var(--bg) 0%, #ffffff 100%);
    color:#2b2338;
}

h1{
    margin:0 0 12px 0;
    font-size:1.6rem;
    color:var(--purple-700);
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin:12px 0 18px 0;
}

.controls .group{
    background:var(--panel);
    border:1px solid #ece6fb;
    padding:8px;
    border-radius:8px;
}

button{
    padding:6px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:0.9rem;
    background:var(--purple-500);
    color:#fff;
}

a{
    display:inline-block;
    margin-top:6px;
    margin-bottom:14px;
    padding:6px 12px;
    background:var(--purple-500);
    color:white;
    text-decoration:none;
    border-radius:6px;
    font-size:0.9rem;
}

#changeFinished{
    background:transparent;
    border:1px solid var(--purple-300);
    color:var(--purple-700);
}

.small{
    padding:5px 8px;
    font-size:0.85rem;
    background:transparent;
    border:1px solid #e6dfff;
    color:var(--purple-700);
}

select, input[type="date"]{
    padding:6px 8px;
    border-radius:6px;
    border:1px solid #efe8ff;
    background:var(--panel);
    color:var(--muted);
    font-size:0.92rem;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
    background:var(--panel);
    font-size:0.95rem;
    border-radius:10px;
    overflow:hidden;
}

th,td{
    border-bottom:1px solid #f0ecf8;
    padding:12px 10px;
    text-align:left;
}

thead th{
    background:linear-gradient(90deg,var(--purple-100), #fff);
    color:var(--purple-700);
}

tbody tr:nth-child(even){background:#faf7ff;}

td button{
  margin-right:6px;
  padding:6px 8px;
  font-size:0.85rem;
  border-radius:6px;
}

.active{
    background:var(--purple-700);
    color:white;
    pointer-events:none;
}

.notstarted{
  background:var(--orange); 
  color:#fff; }
.work{
  background:var(--blue);   
  color:#fff; }
.done{       
  background:var(--success);
  color:#fff; }
.cancel{     
  background:var(--danger); 
  color:#fff; }

@media (max-width:820px){
    .controls{
        flex-direction:column;
        align-items:stretch;
    }
    th,td{
        padding:10px 8px;
        font-size:0.9rem;
    }
}
</style>

<script>
let priorities=[
    {idPriority:"1",priority:"VERY HIGH"},
    {idPriority:"2",priority:"High"},
    {idPriority:"3",priority:"Medium"},
    {idPriority:"4",priority:"Low"},
    {idPriority:"5",priority:"very low"}
];

let status=[
    {idStatus:"1",status:"Not started :)"},
    {idStatus:"2",status:"Working in it ..."},
    {idStatus:"3",status:"Finished (Finally)"},
    {idStatus:"4",status:"Canceled X_X"}
];

let types=[
    {idType:"1",type:"Own personal stuff"},
    {idType:"2",type:"Buying things"},
    {idType:"3",type:"Study and work"},
    {idType:"4",type:"Preparing meal"},
    {idType:"5",type:"Other things"}
];

let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

let finished = false;
let filterPriority = "all";
let filterStatus = "all";
let dateFrom = "";
let dateTo = "";
let sortOrder = "none";

document.addEventListener("DOMContentLoaded", () => {
    loadfilters();
    buildTable();
});

function loadfilters(){
    document.getElementById("filterPriority").innerHTML =
        `<option value="all">All priorities</option>` +
        priorities.map(p=>`<option value="${p.idPriority}">${p.priority}</option>`).join("");

    document.getElementById("filterStatus").innerHTML =
        `<option value="all">All statuses</option>` +
        status.map(s=>`<option value="${s.idStatus}">${s.status}</option>`).join("");

    document.getElementById("sortOrder").value = sortOrder;
}

function applyFilters(){
    filterPriority = document.getElementById("filterPriority").value;
    filterStatus = document.getElementById("filterStatus").value;
    dateFrom = document.getElementById("dateFrom").value;
    dateTo = document.getElementById("dateTo").value;
    sortOrder = document.getElementById("sortOrder").value;
    buildTable();
}

function clearFilters(){
    filterPriority="all";
    filterStatus="all";
    dateFrom="";
    dateTo="";
    sortOrder="none";

    loadfilters();
    document.getElementById("dateFrom").value="";
    document.getElementById("dateTo").value="";

    buildTable();
}

function buildTable(){
    let tbody=document.getElementById("task-body");
    tbody.innerHTML="";

    let filtered = tasks.filter(task=>{

        if(!finished && task.idStatus=="3") return false;
        if( finished && task.idStatus!="3") return false;

        if(filterPriority!=="all" && task.idPriority!=filterPriority) return false;
        if(filterStatus!=="all" && task.idStatus!=filterStatus) return false;

        if(dateFrom && task.dueDate < dateFrom) return false;
        if(dateTo   && task.dueDate > dateTo) return false;

        return true;
    });

    if(sortOrder!=="none"){
        filtered.sort((a,b)=> sortOrder==="asc"
            ? a.dueDate.localeCompare(b.dueDate)
            : b.dueDate.localeCompare(a.dueDate)
        );
    }

    if(filtered.length===0){
        tbody.innerHTML =
          `<tr><td colspan="8" style="text-align:center; padding:18px; color:var(--muted)">
            No tasks match the selected filters.
           </td></tr>`;
        return;
    }

    filtered.forEach(task=>{
        let pri = priorities.find(p=>p.idPriority==task.idPriority)?.priority || "";
        let typ = types.find(t=>t.idType==task.idType)?.type || "";
        let current = status.find(s=>s.idStatus==task.idStatus)?.status || "";

        let statusButtons = status.map(st => {
            let act = task.idStatus==st.idStatus ? "active" : "";
            return `<button class="${act}" onclick="updateStatus(${task.id},'${st.idStatus}')">${st.status}</button>`;
        }).join("");

        tbody.insertAdjacentHTML("beforeend", `
        <tr>
            <td>${task.id}</td>
            <td>${task.name}</td>
            <td>${task.description || ""}</td>
            <td>${task.dueDate || ""}</td>
            <td>${pri}</td>
            <td>${typ}</td>
            <td>${current}</td>
            <td>${statusButtons}</td>
        </tr>`);
    });
}

function updateStatus(id,newStatus){
    let t = tasks.find(x=>x.id==id);
    if(!t) return;
    t.idStatus = newStatus;
    localStorage.setItem("tasks", JSON.stringify(tasks));
    buildTable();
}

function showFinish(){
    finished = !finished;
    document.getElementById("changeFinished").textContent =
        finished ? "Show Active Tasks" : "Show Finished Tasks";
    buildTable();
}
</script>
</head>

<body>
<h1>Task Summary</h1>
<a href="https://igbal.alwaysdata.net/project/form/">Back to form</a>

<div class="controls">
    <div class="group">
        <label style="font-size:.85rem; color:var(--muted)">Priority</label><br>
        <select id="filterPriority"></select>
    </div>

    <div class="group">
        <label style="font-size:.85rem; color:var(--muted)">Status</label><br>
        <select id="filterStatus"></select>
    </div>

    <div class="group">
        <label style="font-size:.85rem; color:var(--muted)">Due date from</label><br>
        <input type="date" id="dateFrom">
    </div>

    <div class="group">
        <label style="font-size:.85rem; color:var(--muted)">Due date to</label><br>
        <input type="date" id="dateTo">
    </div>

    <div class="group">
        <label style="font-size:.85rem; color:var(--muted)">Sort</label><br>
        <select id="sortOrder" class="small">
            <option value="none">None</option>
            <option value="asc">Due Date ↑</option>
            <option value="desc">Due Date ↓</option>
        </select>
    </div>

    <div style="display:flex; gap:8px; align-items:center;">
        <button onclick="applyFilters()">Apply</button>
        <button onclick="clearFilters()" class="small">Clear</button>
    </div>

    <div style="margin-left:auto;">
        <button id="changeFinished" onclick="showFinish()">Show Finished Tasks</button>
    </div>
</div>

<table>
<thead>
<tr>
<th>ID</th><th>Name</th><th>Description</th><th>Due Date</th>
<th>Priority</th><th>Type</th><th>Status</th><th>Update Status</th>
</tr>
</thead>
<tbody id="task-body"></tbody>
</table>

</body>
</html>
